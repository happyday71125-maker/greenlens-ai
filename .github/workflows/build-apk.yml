      - name: Verify Fixed Keystore Exists Before Build
        run: |
          test -f app/debug.keystore || (echo "ERROR: app/debug.keystore missing!" && exit 1)
          ls -la app/debug.keystore

      - name: Download & Verify Dual On-Device AI Models (Food-V1 2,024 + Swin-Base ONNX)
        run: python3 scripts/fetch_food_model.py

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK Licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          (yes | "$SDKM" --licenses > /dev/null 2>&1) || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Fixed V1+V2 Keystore
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Strict CI Guard — Package ID, VersionCode 20201, Dual Models & Keystore SHA-256
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          BADGING=$("$BUILD_TOOLS/aapt" dump badging "$APK_PATH")
          echo "$BADGING" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"
          echo "$BADGING" | grep -q "name='app.prolauncher.greenlens'" || (echo "ERROR: Package ID mismatch!" && exit 1)
          echo "$BADGING" | grep -q "versionCode='20201'" || (echo "ERROR: VersionCode must be 20201!" && exit 1)
          CERTS=$("$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_PATH")
          echo "$CERTS"
          echo "$CERTS" | grep -iq "c06e02f5c0fe76a441bafaeae26187852ff0039420934eaf3640557ca4619dc7" || (echo "ERROR: Signing certificate SHA-256 mismatch! Update conflict prevented." && exit 1)
          unzip -l "$APK_PATH" | grep -q "assets/food_v1" || (echo "ERROR: Food-V1 model missing!" && exit 1)
          unzip -l "$APK_PATH" | grep -q "assets/swin_food101_uint8.onnx" || (echo "ERROR: Swin-Base ONNX model missing!" && exit 1)
          echo "ALL CI INTEGRITY GUARDS PASSED (v2.2.0 Dual-AI)!"

      - name: Upload GreenLensAI v2.2.0 Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenLensAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit Clean v2.2.0 Android Project Tree to Repository
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync GreenLens AI v2.2.0 full Android source tree & fixed keystore [skip ci]"
            git push || true
          fi
