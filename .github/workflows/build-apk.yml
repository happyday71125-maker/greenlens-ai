          buf = lzma.decompress(base64.b85decode("".join(b85.split())))
          pos = 0
          (cnt,) = struct.unpack_from("<I", buf, pos); pos += 4
          for _ in range(cnt):
              rlen, dlen = struct.unpack_from("<HI", buf, pos); pos += 6
              rel = buf[pos:pos+rlen].decode("utf-8"); pos += rlen
              dat = buf[pos:pos+dlen]; pos += dlen
              p = Path(rel); p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(dat)
          wf = base64.b64decode("")
          for wp in (".github/workflows/build-apk.yml", "workflow_copy_for_web_upload/build-apk.yml"):
