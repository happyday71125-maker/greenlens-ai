          print(f"Unpacked {cnt + 2} files cleanly.")
          PY_UNPACK

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK Licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          (yes | "$SDKM" --licenses > /dev/null 2>&1) || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Fixed Keystore
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify Package ID, VersionCode & Keystore Signature
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | grep -E "package:|sdkVersion:|targetSdkVersion:|application-label:"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_PATH"

      - name: Upload GreenLensAI Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreenLensAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Commit Clean Android Project Tree to Repository
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync GreenLens AI v1.0.0 full Android source tree & fixed keystore [skip ci]"
            git push || true
          fi
